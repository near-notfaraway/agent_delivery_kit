<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-labelledby="title description">
  <title id="title">Agent Delivery Kit 交付流程</title>
  <desc id="description">需求确认后开展方案设计，方案确认后准备隔离仓库和控制材料。按依赖逐任务实现、验证、评审和授权提交，成功执行 complete 后解锁下游。全部任务结束后进行集成验收，形成交付报告。独立任务可以并行。</desc>
  <rect width="1120" height="390" rx="10" fill="#f8fafc"/>
  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="28" y="49" font-size="30" font-weight="650" fill="#0f172a">从需求确认到交付</text>
    <text x="28" y="83" font-size="18" fill="#475569">协调 Agent 推进流程，用户评审与授权，coordctl 保存任务事实。</text>
    <g fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2">
      <rect x="28" y="128" width="160" height="168" rx="8"/>
      <rect x="218" y="128" width="160" height="168" rx="8"/>
      <rect x="408" y="128" width="164" height="168" rx="8"/>
      <rect x="904" y="128" width="188" height="168" rx="8"/>
    </g>
    <rect x="602" y="128" width="272" height="168" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <g fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 190 212 H 216"/>
      <path d="M 210 208 L 216 212 L 210 216"/>
      <path d="M 380 212 H 406"/>
      <path d="M 400 208 L 406 212 L 400 216"/>
      <path d="M 574 212 H 600"/>
      <path d="M 594 208 L 600 212 L 594 216"/>
      <path d="M 876 212 H 902"/>
      <path d="M 896 208 L 902 212 L 896 216"/>
    </g>
    <g font-size="15" fill="#64748b" font-weight="600">
      <text x="46" y="155">01</text>
      <text x="236" y="155">02</text>
      <text x="426" y="155">03</text>
      <text x="620" y="155" fill="#2563eb">04 / 按任务推进</text>
      <text x="922" y="155">05</text>
    </g>
    <g font-size="22" font-weight="650" fill="#0f172a">
      <text x="46" y="190">需求确认</text>
      <text x="236" y="190">方案确认</text>
      <text x="426" y="190">仓库准备</text>
      <text x="620" y="190">逐任务交付</text>
      <text x="922" y="190">集成验收</text>
    </g>
    <g font-size="18" fill="#475569">
      <text x="46" y="257">用户确认范围</text>
      <text x="236" y="257">用户确认方案</text>
      <text x="426" y="225">隔离 worktree</text>
      <text x="426" y="257">执行控制材料</text>
      <text x="620" y="225">实现 · 验证 · Review</text>
      <text x="620" y="257">授权提交 → complete</text>
      <text x="922" y="225">固定修订联调</text>
    </g>
    <g font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="16" fill="#475569">
      <text x="46" y="225">requirement.md</text>
      <text x="236" y="225">design.md</text>
      <text x="922" y="257">delivery-report.md</text>
    </g>
    <path d="M 28 326 H 1092" stroke="#cbd5e1"/>
    <text x="28" y="358" font-size="18" fill="#334155">独立任务可并行；有依赖的任务等待上游 complete 成功。</text>
  </g>
</svg>
